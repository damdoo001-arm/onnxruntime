name: Preview KleidiAI compatibility

on:
  push:
    branches: ['damdoo01/kleidiai-pages-preview']
  workflow_dispatch:
    inputs:
      onnxruntime_ref:
        description: ONNX Runtime branch, tag, or commit to scan
        required: true
        default: main
        type: string
      kleidiai_ref:
        description: KleidiAI branch, tag, or commit to inventory
        required: true
        default: main
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kleidiai-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the ONNX Runtime website
        uses: actions/checkout@v3

      - name: Check out ONNX Runtime source
        uses: actions/checkout@v3
        with:
          repository: microsoft/onnxruntime
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.onnxruntime_ref || 'main' }}
          path: .sources/onnxruntime
          fetch-depth: 1

      - name: Check out KleidiAI source and release tags
        uses: actions/checkout@v3
        with:
          repository: ARM-software/kleidiai
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.kleidiai_ref || 'main' }}
          path: .sources/kleidiai
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate the KleidiAI compatibility page
        env:
          KLEIDIAI_SOURCE_ROOT: ${{ github.workspace }}/.sources/kleidiai
          ONNXRUNTIME_SOURCE_ROOT: ${{ github.workspace }}/.sources/onnxruntime
          KLEIDIAI_PR_CANDIDATES: ${{ github.workspace }}/_tools/kleidiai_compatibility/open_kernel_prs.json
          KLEIDIAI_PAGES_OUTPUT: ${{ github.workspace }}/docs/performance/kleidiai/index.html
          KLEIDIAI_STANDALONE_OUTPUT: ${{ runner.temp }}/kleidiai_onnxruntime_compatibility.html
          KLEIDIAI_MARKDOWN_OUTPUT: ${{ github.workspace }}/docs/performance/kleidiai/README.md
          KLEIDIAI_MARKDOWN_STANDALONE_OUTPUT: ${{ runner.temp }}/kleidiai_onnxruntime_compatibility.md
        run: |
          python _tools/kleidiai_compatibility/generate_ort_compatibility_html.py
          python _tools/kleidiai_compatibility/generate_ort_compatibility.py

      - name: Validate the generated page
        run: >-
          python _tools/kleidiai_compatibility/validate_generated_page.py
          docs/performance/kleidiai/index.html

      - name: Remove temporary source checkouts
        run: rm -rf -- "$GITHUB_WORKSPACE/.sources"

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install website dependencies
        run: npm install

      - name: Build documentation with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Build the ONNX Runtime landing site
        run: npm run build

      - name: Merge the landing site into the documentation artifact
        run: cp -R ./build/. ./_site/

      - name: Upload the generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          retention-days: 21

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
